<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- ISO/IEC 27001 standard mark in the familiar round-seal style.
       The bottom arc reads STANDARD, not "Certified": the card is marked
       pending, and a seal claiming certification we do not hold would be a
       false statement to every visitor who only glances at the image. -->
  <defs>
    <path id="arcTop" d="M 338 460 A 262 262 0 0 1 862 460"/>
    <path id="arcBottom" d="M 352 460 A 248 248 0 0 0 848 460"/>
    <clipPath id="innerClip"><circle cx="600" cy="460" r="196"/></clipPath>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- outer ring -->
  <circle cx="600" cy="460" r="298" fill="#ffffff" stroke="#1b75bb" stroke-width="15"/>
  <circle cx="600" cy="460" r="214" fill="none" stroke="#1b75bb" stroke-width="8"/>

  <!-- inner disc + globe grid -->
  <circle cx="600" cy="460" r="196" fill="#cfd2d3"/>
  <g clip-path="url(#innerClip)" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.4">
    <circle cx="600" cy="460" r="150"/>
    <ellipse cx="600" cy="460" rx="70" ry="150"/>
    <ellipse cx="600" cy="460" rx="130" ry="150"/>
    <path d="M462 380 H738 M462 540 H738"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="470" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="150" font-weight="700" letter-spacing="-4" fill="#ffffff">ISO</text>
  <text x="600" y="576" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="86" font-weight="600" letter-spacing="1" fill="#1b75bb">27001</text>

  <!-- arced captions -->
  <text font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="40" font-weight="500" letter-spacing="1.5" fill="#1b75bb">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">Information Security Management</textPath>
  </text>
  <text font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="42" font-weight="500" letter-spacing="3" fill="#1b75bb">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">Standard</textPath>
  </text>
</svg>
